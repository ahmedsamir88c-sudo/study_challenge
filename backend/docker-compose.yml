services:
  db:
    image: postgres:16-alpine
    container_name: study_challenge_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: study_challenge
      POSTGRES_USER: study_admin
      POSTGRES_PASSWORD: change_this_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study_admin -d study_challenge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
